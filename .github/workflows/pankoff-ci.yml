name: Dual Bot Production Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.profile }} production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [business, crypto]
    env:
      CONTENT_PROFILE: ${{ matrix.profile }}
      OPENAI_MODEL: gpt-5.6-luna
      PORT: '3000'
      BASE_PATH: '/'
      ENABLE_MEDIA_DOWNLOAD: 'true'
      POSTING_TIMEZONE: 'Europe/Kyiv'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Railway startup env smoke test
        run: sh scripts/railway-startup-smoke.sh
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply shared OpenAI compatibility and local-day accounting
        run: |
          node scripts/patch-openai-default-temperature.mjs
          node scripts/patch-local-day-accounting.mjs
          ! grep -q '^[[:space:]]*temperature:' artifacts/api-server/src/lib/openai.ts
          grep -q 'LOCAL_AI_USAGE_DAY' artifacts/api-server/src/lib/openai.ts
          grep -q 'requestedTimezone = process.env.POSTING_TIMEZONE' artifacts/api-server/src/lib/openai.ts
          grep -q 'CRYPTO_GENERATED_BUDGET_SELF_HEAL' artifacts/api-server/src/lib/runtime-schedule.ts
          grep -q 'legacyGeneratedPostCeiling = profile === "crypto" ? 8 : 6' artifacts/api-server/src/lib/runtime-schedule.ts
      - name: Apply PANKOFF runtime patches
        if: matrix.profile == 'crypto'
        run: |
          node scripts/patch-pankoff-footer.mjs
          node scripts/patch-pankoff-hardening-2.mjs
          node scripts/patch-pankoff-style-v2.mjs
          node scripts/patch-pankoff-publish-recovery.mjs
          node scripts/patch-pankoff-final-hardening.mjs
          node scripts/patch-pankoff-disable-footer.mjs
      - name: Apply FINCENTRE runtime patches
        if: matrix.profile == 'business'
        run: |
          node scripts/patch-fincentre-stall-v2.mjs
          node scripts/patch-fincentre-schedule-defaults.mjs
          node scripts/patch-fincentre-editorial-v1.mjs
      - name: Apply shared reliability, output safety and QC resilience
        run: |
          node scripts/patch-autopost-reliability.mjs
          node scripts/patch-ai-output-safety.mjs
          node scripts/patch-quality-check-resilience.mjs
      - name: Apply PANKOFF today/style/autotest final patches
        if: matrix.profile == 'crypto'
        run: |
          node scripts/patch-pankoff-today-v3.mjs
          node scripts/patch-pankoff-autotest-transport.mjs
      - name: Apply FINCENTRE final publisher patch
        if: matrix.profile == 'business'
        run: node scripts/patch-fincentre-publisher-v2.mjs
      - name: Apply natural autopost throughput hardening
        run: node scripts/patch-autopost-throughput-v1.mjs
      - name: Profile isolation and reliability smoke test
        run: |
          grep -q 'patch-openai-default-temperature.mjs' scripts/start-railway.sh
          grep -q 'patch-local-day-accounting.mjs' scripts/start-railway.sh
          grep -q 'patch-autopost-reliability.mjs' scripts/start-railway.sh
          grep -q 'patch-ai-output-safety.mjs' scripts/start-railway.sh
          grep -q 'patch-quality-check-resilience.mjs' scripts/start-railway.sh
          grep -q 'patch-autopost-throughput-v1.mjs' scripts/start-railway.sh
          ! grep -q '^[[:space:]]*temperature:' artifacts/api-server/src/lib/openai.ts
          grep -q 'LOCAL_AI_USAGE_DAY' artifacts/api-server/src/lib/openai.ts
          grep -q 'AI_STRUCTURED_OUTPUT_REPAIR' artifacts/api-server/src/lib/openai.ts
          grep -q 'AI_FORMAT_ERROR' artifacts/api-server/src/lib/openai.ts
          grep -q 'QC_STRUCTURED_OUTPUT_RESILIENCE' artifacts/api-server/src/lib/openai.ts
          grep -q 'QC structured-output retry succeeded' artifacts/api-server/src/lib/openai.ts
          grep -q 'max_completion_tokens: retry ? 900 : 800' artifacts/api-server/src/lib/openai.ts
          grep -q 'AI_FORMAT_ERROR_SOURCE_SKIP' artifacts/api-server/src/lib/auto-generate.ts
          grep -q 'RAW_AI_PAYLOAD_PUBLISH_GUARD' artifacts/api-server/src/lib/telegram.ts
          grep -q 'LEGACY_RAW_AI_DRAFT_SKIP' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'AUTOPUBLISH_DEEP_QUEUE_SCAN' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'limit(100)' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'AUTO_GENERATE_ERROR_RETRY_MINUTES' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'generation failed; short retry scheduled' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'AUTOPUBLISH_AI_CALL_BUDGET_ONLY' artifacts/api-server/src/lib/openai.ts
          grep -q 'SCHEDULER_AI_CALL_BUDGET_ONLY' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'AUTO_REVIEW_SHORT_RETRY' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'AUTO_GENERATE_RETRY_MINUTES ?? "10"' artifacts/api-server/src/lib/scheduler.ts
          ! grep -q 'usage.postsGenerated >= settings.maxPostsPerDay' artifacts/api-server/src/lib/openai.ts
          ! grep -q 'usage.postsGenerated >= settings.maxPostsPerDay' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'recommendedCalls = profile === "crypto" ? 80 : 60' artifacts/api-server/src/lib/runtime-schedule.ts
          grep -q 'recommendedGeneratedPosts = profile === "crypto" ? 12 : 10' artifacts/api-server/src/lib/runtime-schedule.ts
          grep -q 'legacyGeneratedPostCeiling = profile === "crypto" ? 8 : 6' artifacts/api-server/src/lib/runtime-schedule.ts
          grep -q 'default(60)' lib/db/src/schema/settings.ts
          grep -q 'default(10)' lib/db/src/schema/settings.ts
          if [ "$CONTENT_PROFILE" = "crypto" ]; then
            grep -q 'patch-pankoff-final-hardening.mjs' scripts/start-railway.sh
            grep -q 'patch-pankoff-disable-footer.mjs' scripts/start-railway.sh
            grep -q 'patch-pankoff-today-v3.mjs' scripts/start-railway.sh
            grep -q 'patch-pankoff-autotest-transport.mjs' scripts/start-railway.sh
            grep -q 'PANKOFF_NO_EMERGENCY_RSS' scripts/patch-pankoff-final-hardening.mjs
            grep -q 'PANKOFF_DASHBOARD_MEDIA_PUBLISH' scripts/patch-pankoff-final-hardening.mjs
            grep -q 'PANKOFF_REVIEW_RECOVERABLE_LOCK' scripts/patch-pankoff-final-hardening.mjs
            grep -q 'PANKOFF_SOCIAL_FOOTER_DISABLED' artifacts/api-server/src/lib/telegram.ts
            grep -q 'PANKOFF_EDITORIAL_V3_TODAY' artifacts/api-server/src/lib/openai.ts
            grep -q 'PANKOFF_QC_V3_TODAY' artifacts/api-server/src/lib/openai.ts
            grep -q 'PANKOFF_KYIV_TODAY_ONLY' artifacts/api-server/src/lib/crypto-policy.ts
            grep -q 'isCryptoSourceToday' artifacts/api-server/src/lib/scheduler.ts
            grep -q 'CRYPTO_MAX_BODY_LENGTH = 420' artifacts/api-server/src/lib/crypto-policy.ts
            grep -q 'PANKOFF_TODAY_CANDIDATE_DEPTH' artifacts/api-server/src/lib/auto-generate.ts
            grep -q 'PANKOFF_AUTOPUBLISH_TEST_FORCE' artifacts/api-server/src/lib/scheduler.ts
            grep -q 'PANKOFF_TEST_AUTOPUBLISH_ENDPOINT' artifacts/api-server/src/routes/schedule.ts
            grep -q 'PANKOFF_TEST_AUTOPUBLISH_BUTTON' artifacts/dashboard/src/pages/schedule.tsx
            grep -q 'PANKOFF_AUTOTEST_TRANSPORT_PROBE' artifacts/api-server/src/lib/telegram.ts
            grep -q 'PANKOFF_AUTOTEST_NO_NEWS_TRANSPORT' artifacts/api-server/src/routes/schedule.ts
            ! grep -q 'PANKOFF_FOOTER_PREVIEW' artifacts/dashboard/src/pages/posts.tsx
            ! grep -q 'FINCENTRE_NO_POST_TTL_MS' artifacts/api-server/src/lib/auto-generate.ts
            ! grep -q 'FINCENTRE_QC_REJECT_TTL' artifacts/api-server/src/lib/auto-generate.ts
            ! grep -q 'FINCENTRE_PUBLIC_SIGNATURE' artifacts/api-server/src/lib/telegram.ts
          else
            grep -q 'FINCENTRE_NO_POST_TTL_MS' artifacts/api-server/src/lib/auto-generate.ts
            grep -q 'FINCENTRE_QC_REJECT_TTL' artifacts/api-server/src/lib/auto-generate.ts
            grep -q 'MIN_BUSINESS_RELEVANCE_SCORE = 1' artifacts/api-server/src/lib/business-filter.ts
            grep -q '@tax_gov_ua' artifacts/api-server/src/index.ts
            grep -q '@nbu_ua' artifacts/api-server/src/index.ts
            grep -q 'isBusiness ? true : undefined' artifacts/api-server/src/lib/runtime-schedule.ts
            grep -q 'САМОСТІЙНУ, ЗРОЗУМІЛУ НОВИНУ' artifacts/api-server/src/lib/openai.ts
            grep -q 'СУДОВІ ТА ЮРИДИЧНІ МАТЕРІАЛИ' artifacts/api-server/src/lib/openai.ts
            grep -q 'blocks.length < 3' artifacts/api-server/src/lib/auto-generate.ts
            grep -q 'opts.content.trim().length < 220' artifacts/api-server/src/lib/auto-generate.ts
            grep -q 'patch-fincentre-editorial-v1.mjs' scripts/start-railway.sh
            grep -q 'patch-fincentre-publisher-v2.mjs' scripts/start-railway.sh
            grep -q 'FINCENTRE_PUBLIC_SIGNATURE' artifacts/api-server/src/lib/telegram.ts
            grep -q 'FINCENTRE_AUTOPUBLISH_TEST_FORCE' artifacts/api-server/src/lib/scheduler.ts
            grep -q 'FINCENTRE_TEST_AUTOPUBLISH_ENDPOINT' artifacts/api-server/src/routes/schedule.ts
            grep -q 'FINCENTRE_TEST_AUTOPUBLISH_BUTTON' artifacts/dashboard/src/pages/schedule.tsx
            grep -q '@fincentre_business' artifacts/api-server/src/lib/telegram.ts
            ! grep -q 'PANKOFF_EDITORIAL_V3_TODAY' artifacts/api-server/src/lib/openai.ts
            ! grep -q 'PANKOFF_AUTOPUBLISH_TEST_FORCE' artifacts/api-server/src/lib/scheduler.ts
            ! grep -q 'PANKOFF_AUTOTEST_TRANSPORT_PROBE' artifacts/api-server/src/lib/telegram.ts
            ! grep -q 'PANKOFF_FINAL_BODY_GATE' artifacts/api-server/src/lib/telegram.ts
            ! grep -q 'PANKOFF_DASHBOARD_MEDIA_PUBLISH' artifacts/api-server/src/routes/posts.ts
          fi
      - name: Typecheck libraries
        run: pnpm run typecheck:libs
      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck
      - name: Typecheck dashboard
        run: pnpm --filter @workspace/dashboard run typecheck
      - name: Build API
        run: pnpm --filter @workspace/api-server run build
      - name: Build dashboard
        run: pnpm --filter @workspace/dashboard run build
