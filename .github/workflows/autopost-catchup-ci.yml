name: Natural Autopost Catch-up Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  catchup:
    name: ${{ matrix.profile }} catch-up scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [business, crypto]
    env:
      CONTENT_PROFILE: ${{ matrix.profile }}
      OPENAI_MODEL: gpt-5.6-luna
      PORT: '3000'
      BASE_PATH: '/'
      ENABLE_MEDIA_DOWNLOAD: 'true'
      POSTING_TIMEZONE: 'Europe/Kyiv'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply production runtime patches
        run: |
          node scripts/patch-openai-default-temperature.mjs
          node scripts/patch-local-day-accounting.mjs
          if [ "$CONTENT_PROFILE" = "crypto" ]; then
            node scripts/patch-pankoff-footer.mjs
            node scripts/patch-pankoff-hardening-2.mjs
            node scripts/patch-pankoff-style-v2.mjs
            node scripts/patch-pankoff-publish-recovery.mjs
            node scripts/patch-pankoff-final-hardening.mjs
            node scripts/patch-pankoff-disable-footer.mjs
          else
            node scripts/patch-fincentre-stall-v2.mjs
            node scripts/patch-fincentre-schedule-defaults.mjs
            node scripts/patch-fincentre-editorial-v1.mjs
          fi
          node scripts/patch-autopost-reliability.mjs
          node scripts/patch-ai-output-safety.mjs
          node scripts/patch-quality-check-resilience.mjs
          if [ "$CONTENT_PROFILE" = "crypto" ]; then
            node scripts/patch-pankoff-today-v3.mjs
            node scripts/patch-pankoff-autotest-transport.mjs
          else
            node scripts/patch-fincentre-publisher-v2.mjs
          fi
          node scripts/patch-autopost-throughput-v1.mjs
          node scripts/patch-autopost-catchup-v2.mjs
      - name: Verify catch-up behavior markers
        run: |
          grep -q 'patch-autopost-catchup-v2.mjs' scripts/start-railway.sh
          grep -q 'AUTO_CATCHUP_SOURCE_ROTATION' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'AUTO_CATCHUP_SOURCE_ATTEMPTS' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'same-cycle catch-up found an eligible post' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'candidate not eligible; rotating to another source in same cycle' artifacts/api-server/src/lib/scheduler.ts
          grep -q 'AUTO_GENERATE_RETRY_MINUTES ?? "10"' artifacts/api-server/src/lib/scheduler.ts
          ! grep -q 'usage.postsGenerated >= settings.maxPostsPerDay' artifacts/api-server/src/lib/scheduler.ts
      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck
      - name: Build API
        run: pnpm --filter @workspace/api-server run build
